# Public gateway: serves the React build and forwards API calls to the services on the docker network.
# Same path rules as the Vite dev proxy (vite.config.js), so the browser only ever sees one origin.
# TLS is terminated in front of this (AWS load balancer or certbot); see DEPLOY.md.

server_tokens off;

# Real client IP when a load balancer sits in front of nginx (private ranges only)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# https when a load balancer terminated TLS in front of us, otherwise whatever nginx itself received
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- service-to-service routes: only reachable inside the docker network ----
    # (they are protected by x-internal-key too, but should never be public at all)
    location ~ ^/api/(auth|ngo)/internal(/|$) {
        return 404;
    }
    location ^~ /api/internal/ {
        return 404;
    }

    # ---- API ----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;

    location /api/auth/ {
        proxy_pass http://auth:8000;
    }
    location = /api/ngo {
        proxy_pass http://ngo:8001;
    }
    location /api/ngo/ {
        proxy_pass http://ngo:8001;
    }
    location /api/resources {
        proxy_pass http://res:8002;
    }
    location /api/inventory {
        proxy_pass http://res:8002;
    }
    location /allocation/api/ {
        proxy_pass http://alloc:8003;
    }

    # ---- React app ----
    # (add_header inside a location replaces the server-level ones, so they are repeated here)

    # hashed build assets never change, cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # client-side routes (/ngos/123, /requests/...) all load index.html
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
